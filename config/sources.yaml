# AI × MEDIA DAILY RADAR — 수집 출처 목록
#
# 필드
#   id            고유 ID (DB에 저장되므로 바꾸지 말 것)
#   name          표시 이름
#   group         ai_global | media_global | korea | korea_company | wired
#   type          rss | arxiv_api | html_list
#   url           피드/API/목록 페이지 주소
#   enabled       false면 수집하지 않음
#   default_category  AI | MEDIA | BOTH  (LLM이 없을 때 분류 힌트)
#   prefilter     true면 AI·미디어 키워드가 있는 기사만 분석 대상으로 넘김
#                 (종합지·IT 매체처럼 기사량이 많은 피드에 사용)
#   max_items     1회 수집 시 최대 기사 수
#   verified      마지막 접근 확인 결과 (사람이 읽는 메모)
#
# 접근 확인일: 2026-11-09 (KST). 결과는 `python -m src.main sources-check`로 다시 확인할 수 있다.
# 확인되지 않은 경로는 만들어 넣지 않고 enabled: false + 사유로 남겨 둔다.

sources:
  # ───────────── A. 글로벌 AI 산업·기술 ─────────────
  - id: openai
    name: OpenAI News
    group: ai_global
    type: rss
    url: https://openai.com/news/rss.xml
    enabled: true
    default_category: AI
    max_items: 20
    verified: "200 OK, RSS 1368건(전체 아카이브) — max_items로 최근분만 사용"

  - id: anthropic
    name: Anthropic News
    group: ai_global
    type: html_list
    url: https://www.anthropic.com/news
    enabled: true
    default_category: AI
    max_items: 8
    html:
      link_pattern: '^/news/[a-z0-9][a-z0-9\-]+$'
      exclude_paths: ["/news/announcements", "/news/features", "/news/partnerships", "/news/product", "/news/policy", "/news/societal-impacts"]
      fetch_detail: true
    verified: "공식 RSS 없음(/rss.xml, /news/rss.xml 404). robots.txt 'Allow: /' 확인 → 목록 페이지 파싱 + 기사 메타(article:published_time) 사용"

